<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disk Treemap</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Disk Treemap</h1>
      <p id="rootPath">Root: loading...</p>
      <div id="scanLive" class="scan-live" hidden aria-live="polite">
        <div id="scanLiveSummary" class="scan-live-summary"></div>
        <div id="scanLiveDetails" class="scan-live-details"></div>
      </div>
    </div>
    <div class="actions">
      <button id="scanButton" type="button">Run Scan</button>
      <span id="scanState" class="state">Idle</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel controls-panel">
      <div class="controls-row">
        <label>
          Compare to scan
          <select id="compareBaseSelect">
            <option value="">None</option>
          </select>
        </label>
        <button id="clearCompareButton" type="button" class="secondary">Clear Compare</button>
      </div>
      <div class="controls-row filters">
        <label>
          Search
          <input id="searchInput" type="text" placeholder="name contains..." />
        </label>
        <label>
          Type
          <select id="typeFilter">
            <option value="">All</option>
            <option value="dir">Dirs</option>
            <option value="file">Files</option>
          </select>
        </label>
        <label>
          Min bytes
          <input id="minSizeInput" type="number" min="0" step="1" value="0" />
        </label>
        <label>
          Sort
          <select id="sortSelect">
            <option value="size_desc">Size desc</option>
            <option value="size_asc">Size asc</option>
            <option value="name_asc">Name asc</option>
            <option value="name_desc">Name desc</option>
          </select>
        </label>
        <button id="applyFiltersButton" type="button">Apply</button>
        <button id="resetFiltersButton" type="button" class="secondary">Reset</button>
      </div>
    </section>

    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>Treemap</h2>
        <div id="breadcrumb" class="breadcrumb"></div>
      </div>
      <div id="chart"></div>
      <p id="chartHint" class="hint">Run a scan to view file sizes.</p>
    </section>

    <section class="panel diff-panel" id="diffPanel" hidden>
      <div class="panel-head">
        <h2>Directory Diff</h2>
        <p id="diffMeta" class="hint"></p>
      </div>
      <div class="diff-grid">
        <div>
          <h3>Top Growth</h3>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Delta</th>
                <th>%</th>
              </tr>
            </thead>
            <tbody id="growthTable"></tbody>
          </table>
        </div>
        <div>
          <h3>Top Shrink</h3>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Delta</th>
                <th>%</th>
              </tr>
            </thead>
            <tbody id="shrinkTable"></tbody>
          </table>
        </div>
      </div>
      <p id="diffEmpty" class="hint" hidden>No directory deltas for this path.</p>
    </section>

    <aside class="panel side-panel">
      <section>
        <div class="panel-head">
          <h2>Scan History</h2>
          <button id="refreshHistoryButton" type="button" class="secondary">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Status</th>
              <th>Total</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </section>

      <section>
        <h2>Largest Items</h2>
        <p id="scanMeta" class="hint">No scan data yet.</p>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Size</th>
            </tr>
          </thead>
          <tbody id="largestTable"></tbody>
        </table>
      </section>
    </aside>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
</body>
</html>
