version: 2

multi-ecosystem-groups:
  # Bundle infrastructure-related version updates into a single PR.
  infrastructure:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "deps(infra)"
    pull-request-branch-name:
      separator: "-"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    commit-message:
      prefix: "deps(go)"
    pull-request-branch-name:
      separator: "-"
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-major:
        patterns:
          - "*"
        update-types:
          - "major"
      go-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 2
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
