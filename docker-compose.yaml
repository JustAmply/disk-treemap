services:
  disk-treemap:
    build: .
    image: disk-treemap:latest
    user: "0:0"
    environment:
      ANALYZE_ROOT: /scanroot
      # Optional tuning overrides. Defaults are usually enough.
      # LISTEN_ADDR: :8080
      # DATA_DIR: /data
      # SCAN_AUTOTUNE: "true"
      # SCAN_MAX_CONCURRENCY: 64
      # SCAN_MAX_WRITE_BATCH_SIZE: 32768
      # SCAN_TIMEOUT: 0
      # MAX_CHILDREN_PER_QUERY: 500
    volumes:
      - /host/path/to/analyze:/scanroot:ro
      - treemap-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  treemap-data:

