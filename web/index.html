<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disk Treemap</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Disk Treemap</h1>
      <p id="rootPath">Root: loading...</p>
      <div id="scanLive" class="scan-live" hidden aria-live="polite">
        <div id="scanLiveSummary" class="scan-live-summary"></div>
        <div id="scanLiveDetails" class="scan-live-details"></div>
      </div>
    </div>
    <div class="actions">
      <button id="scanButton" type="button">Run Scan</button>
      <span id="scanState" class="state">Idle</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>Treemap</h2>
        <div id="breadcrumb" class="breadcrumb"></div>
      </div>
      <div id="chart"></div>
      <p id="chartHint" class="hint">Run a scan to view file sizes.</p>
    </section>

    <aside class="panel side-panel">
      <h2>Largest Items</h2>
      <p id="scanMeta" class="hint">No scan data yet.</p>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Size</th>
          </tr>
        </thead>
        <tbody id="largestTable"></tbody>
      </table>
    </aside>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
</body>
</html>
