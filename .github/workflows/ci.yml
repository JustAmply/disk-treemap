name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_open_pr_on_push: ${{ steps.detect.outputs.has_open_pr_on_push }}
    steps:
      - name: Detect duplicate push for open PR
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('has_open_pr_on_push', 'false');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const { data } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });

            core.setOutput('has_open_pr_on_push', data.length > 0 ? 'true' : 'false');

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: github.event_name == 'pull_request' || needs.preflight.outputs.has_open_pr_on_push != 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Resolve modules
        run: go mod download

      - name: Run tests
        run: go test -mod=mod ./...

      - name: Build server
        run: go build -mod=mod ./cmd/server

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - preflight
      - test
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && needs.preflight.outputs.has_open_pr_on_push != 'true')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
